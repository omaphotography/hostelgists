      </div>

    </div>

    <div class="sidebar-links">

      <a href="index.html">

      </a>

      <a href="add-hostel.html">

        Add Hostel
      </a>

      <a href="profile.html" class="active">
        <i class="fa fa-user"></i>
        Profile
      </a>

      <a
        href="admin-login.html"
        class="admin-link"
      >
        <i class="fa fa-lock"></i>
        Admin
      </a>

    </div>

  </div>



  <!-- MAIN -->
  <div class="main">

    <div class="app">

      <!-- HEADER -->
      <div class="header">

        <div class="header-left">

          <div class="logo-box">
            <i class="fa fa-user"></i>
          </div>

          <div>

            <h2>My Profile</h2>

            <small>
              Your HostelGist Account

      </div>



      <!-- PROFILE -->
      <div

      <!-- CONTACT -->
      <div class="form-card contact-box">

        <h3 class="contact-title">

          <i class="fa fa-headset"></i>

          Contact Us

        </h3>

        <a
          href="mailto:aduraoma2003@gmail.com"
          class="contact-btn email-btn"
        >

          <i class="fa fa-envelope"></i>

          Email Us

        </a>

        <a
          href="https://wa.me/2348065124880"
          target="_blank"
          class="contact-btn whatsapp-btn"
        >

          <i class="fab fa-whatsapp"></i>

          Chat on WhatsApp

        </a>

      </div>



      <!-- LOGOUT -->
      <button
        onclick="logout()"
        class="logout-btn"
      >

        <i class="fa fa-sign-out-alt"></i>

        Logout

      </button>

</div>



<!-- MOBILE NAV -->
<div class="nav">

  <a href="index.html">

    <i class="fa fa-home"></i>

  </a>

  <a href="map.html">

    <i class="fa fa-map"></i>

  </a>

  <a href="add-hostel.html">

    <i class="fa fa-plus"></i>

  </a>

  <a
    href="profile.html"
    class="active"
  >

    <i class="fa fa-user"></i>

  </a>

</div>



<script type="module">

import { supabase } from "./js/supabase.js";

const box =
  document.getElementById(
    "profileBox"
  );

/* =========================
LOAD PROFILE
========================= */

async function loadProfile() {

  try {

    /* =========================
    GET LOGGED IN USER
    ========================= */

    const {
      data: { user },
      error: userError
    } = await supabase.auth.getUser();

    if (userError || !user) {

      window.location.href =
        "login.html";

      return;
    }

    /* =========================
    GET PROFILE
    ========================= */

    const {
      data,
      error
    } = await supabase
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

    /* =========================
    AUTO CREATE PROFILE IF MISSING
    ========================= */

    let profile = data;

    if (!profile) {

      const newProfile = {
        id: user.id,
        name:
          user.user_metadata?.name ||
          "User",
        email:
          user.email
      };

      const {
        data: insertedProfile,
        error: insertError
      } = await supabase
        .from("profiles")
        .insert([newProfile])
        .select()
        .single();

      if (insertError) {

        console.log(insertError);

        box.innerHTML = `

          <div class="error-profile">

            <i class="fa fa-circle-exclamation"></i>

            <p>
              Failed to create profile
            </p>

          </div>

        `;

        return;
      }

      profile = insertedProfile;
    }

    /* =========================
    PROFILE VALUES
    ========================= */

    const fullName =
      profile?.name ||
      user.user_metadata?.name ||
      "User";

    const email =
      profile?.email ||
      user.email ||
      "No Email";

    /* =========================
    SHOW PROFILE
    ========================= */

    box.innerHTML = `

      <div class="profile-wrapper">

        <div class="profile-avatar">

          ${fullName
            .charAt(0)
            .toUpperCase()}

        </div>

        <h2 class="profile-name">

          ${fullName}

        </h2>

        <p class="profile-email">

          <i class="fa fa-envelope"></i>

          ${email}

        </p>

        <div class="profile-info-grid">

          <div class="profile-info-card">

            <i class="fa fa-user"></i>

            <h4>Registered Name</h4>

            <p>${fullName}</p>

          </div>

          <div class="profile-info-card">

            <i class="fa fa-at"></i>

            <h4>Email Address</h4>

            <p>${email}</p>

          </div>

        </div>

      </div>

    `;

  } catch (err) {

    console.log(err);

    box.innerHTML = `

      <div class="error-profile">

        <i class="fa fa-circle-exclamation"></i>

        <p>
          Something went wrong
        </p>

      </div>

    `;
  }
}

/* =========================
LOGOUT
========================= */

window.logout = async () => {

  const confirmLogout =
    confirm(
      "Are you sure you want to logout?"
    );

  if (!confirmLogout) return;

  await supabase.auth.signOut();

  window.location.href =
    "login.html";
};

/* =========================
START
========================= */

loadProfile();

</script>

</body>
</html>
