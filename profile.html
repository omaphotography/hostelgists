<!DOCTYPE html>
<html>
<head>
  <title>Profile - HostelGist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="desktop-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h3><i class="fa fa-building"></i> HostelGist</h3>

    <a href="index.html"><i class="fa fa-home"></i> Home</a>
    <a href="add-hostel.html"><i class="fa fa-plus"></i> Add Hostel</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>

    <a href="admin-login.html" style="font-size:12px; color:red;">
      Admin
    </a>

  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="app">

      <!-- HEADER -->
      <div class="header">
        <h2><i class="fa fa-user"></i> My Profile</h2>
      </div>

      <!-- PROFILE BOX -->
      <div class="form-card" id="profileBox">
        <p>Loading profile...</p>
      </div>

      <!-- LOGOUT -->
      <button onclick="logout()">
        <i class="fa fa-sign-out-alt"></i> Logout
      </button>

    </div>

  </div>

</div>

<!-- MOBILE NAV -->
<div class="nav">

  <a href="index.html">
    <i class="fa fa-home"></i>
  </a>

  <a href="#">
    <i class="fa fa-map"></i>
  </a>

  <a href="add-hostel.html">
    <i class="fa fa-plus"></i>
  </a>

  <a href="profile.html" class="active">
    <i class="fa fa-user"></i>
  </a>

</div>

<script type="module">
import { supabase } from "./js/supabase.js"

const box = document.getElementById("profileBox")

/* ================= LOAD PROFILE ================= */
async function loadProfile() {

  const { data: { user }, error } = await supabase.auth.getUser()

  if (!user) {
    window.location.href = "login.html"
    return
  }

  const { data, error: profileError } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single()

  if (profileError) {
    box.innerHTML = "<p>Failed to load profile</p>"
    console.log(profileError.message)
    return
  }

  box.innerHTML = `
    <div style="text-align:center;">
      
      <div style="
        width:80px;
        height:80px;
        border-radius:50%;
        background:#2563eb;
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:30px;
        margin:auto;
      ">
        ${data.name ? data.name.charAt(0).toUpperCase() : "U"}
      </div>

      <h3 style="margin-top:10px;">${data.name || "No Name"}</h3>
      <p style="color:gray;">${data.email || user.email}</p>

    </div>
  `
}

/* ================= LOGOUT ================= */
window.logout = async () => {

  const confirmLogout = confirm("Are you sure you want to logout?")
  if (!confirmLogout) return

  const { error } = await supabase.auth.signOut()

  if (error) {
    alert("Logout failed")
    console.log(error.message)
    return
  }

  window.location.href = "login.html"
}

loadProfile()
</script>

</body>
</html>
