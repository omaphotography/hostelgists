<!DOCTYPE html>
<html>
<head>

  <title>Login - HostelGist</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="css/style.css">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">

      <div class="logo-box">
        <i class="fa fa-building"></i>
      </div>

      <h2>HostelGist</h2>

      <p>
        Welcome back
      </p>

    </div>



    <div class="form-card">

      <input type="email"
             id="email"
             placeholder="Email">

      <input type="password"
             id="password"
             placeholder="Password">

      <button onclick="login()">
        Login
      </button>

      <p class="auth-switch">

        Don't have an account?

        <a href="signup.html">
          Sign up
        </a>

      </p>

    </div>

  </div>

</div>



<script type="module">

import { supabase }
from "./js/supabase.js"

window.login = async function () {

  const email =
    document.getElementById("email").value

  const password =
    document.getElementById("password").value



  const { error } =
    await supabase.auth.signInWithPassword({

      email,
      password

    })



  if (error) {

    alert(error.message)

    return
  }



  const redirect =
    localStorage.getItem("redirectAfterLogin")



  if (redirect) {

    localStorage.removeItem("redirectAfterLogin")

    window.location.href = redirect

  } else {

    window.location.href = "index.html"
  }
}

</script>

</body>
</html>
