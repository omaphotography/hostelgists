<!DOCTYPE html>
<html>
<head>
  <title>HostelGist</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="desktop-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="sidebar-top">

      <div class="logo-box">
        <i class="fa fa-building"></i>
      </div>

      <h2>HostelGist</h2>

    </div>

    <div class="sidebar-links">

      <a href="index.html" class="active">
        <i class="fa fa-home"></i>
        Home
      </a>

      <a href="add-hostel.html">
        <i class="fa fa-plus"></i>
        Add Hostel
      </a>

      <a href="profile.html">
        <i class="fa fa-user"></i>
        Profile
      </a>

      <a href="map.html">
        <i class="fa fa-map"></i>
        Map
      </a>

      <a href="admin-login.html"
         class="admin-link">

        <i class="fa fa-lock"></i>
        Admin

      </a>

    </div>

  </div>



  <!-- MAIN -->
  <div class="main">

    <div class="app">

      <!-- HEADER -->
      <div class="header">

        <div class="header-left">

          <div class="logo-box">
            <i class="fa fa-building"></i>
          </div>

          <div>

            <h2>HostelGist</h2>

            <small>
              Student Hostel Reviews
            </small>

          </div>

        </div>



        <div class="header-right">

          <button class="mini-btn">
            <i class="fa fa-bell"></i>
          </button>

          <div class="profile-circle">
            <i class="fa fa-user"></i>
          </div>

        </div>

      </div>



      <!-- SEARCH -->
      <div class="search">

        <i class="fa fa-search"></i>

        <input type="text"
               id="searchInput"
               placeholder="Search hostels...">

      </div>



      <!-- FILTERS -->
      <div class="filters">

  <button
    id="all"
    class="filter-btn active"
    onclick="filterHostels('all')">

    All
  </button>

  <button
    id="cheap"
    class="filter-btn"
    onclick="filterHostels('cheap')">

    Cheap
  </button>

  <button
    id="expensive"
    class="filter-btn"
    onclick="filterHostels('expensive')">

    Expensive
  </button>

  <button
    id="top"
    class="filter-btn"
    onclick="filterHostels('top')">

    Top Rated
  </button>

</div>



      <!-- HOSTELS -->
      <div id="hostels"
           class="hostel-grid"></div>

    </div>

  </div>

</div>



<!-- MOBILE NAV -->
<div class="nav">

  <a href="index.html"
     class="active">

    <i class="fa fa-home"></i>

  </a>

  <a href="map.html">

    <i class="fa fa-map"></i>

  </a>

  <a href="add-hostel.html">

    <i class="fa fa-plus"></i>

  </a>

  <a href="profile.html">

    <i class="fa fa-user"></i>

  </a>

</div>



<script type="module"
        src="js/home.js"></script>

</body>
</html>
