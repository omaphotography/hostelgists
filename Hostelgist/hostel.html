<!DOCTYPE html>
<html>
<head>
  <title>Hostel Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="desktop-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3><i class="fa fa-building"></i> HostelGist</h3>

    <a href="index.html"><i class="fa fa-home"></i> Home</a>
    <a href="add-hostel.html"><i class="fa fa-plus"></i> Add Hostel</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="app">

      <!-- HEADER -->
      <div class="header">
        <h2><i class="fa fa-building"></i> Hostel Details</h2>
      </div>

      <!-- HOSTEL DETAILS -->
      <div id="details">Loading...</div>

      <!-- REVIEWS -->
      <h3 style="margin-top:20px;">
        <i class="fa fa-star"></i> Reviews
      </h3>

      <div id="reviews"></div>

      <!-- BUTTON -->
      <button onclick="showReviewForm()" style="margin-top:15px;">
        Add Review
      </button>

      <!-- REVIEW FORM -->
      <div class="form-card" id="reviewBox" style="display:none; margin-top:20px;">

        <h4><i class="fa fa-pen"></i> Add Review</h4>

        <div id="stars">
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
        </div>

        <textarea id="comment" placeholder="Write your review..."></textarea>

        <button onclick="submitReview()">Submit Review</button>

      </div>

    </div>

  </div>

</div>

<!-- MOBILE NAV -->
<div class="nav">
  <a href="index.html"><i class="fa fa-home"></i></a>
  <a href="#"><i class="fa fa-map"></i></a>
  <a href="add-hostel.html"><i class="fa fa-plus"></i></a>
  <a href="profile.html"><i class="fa fa-user"></i></a>
</div>

<script type="module" src="js/hostel.js"></script>

</body>
</html>
